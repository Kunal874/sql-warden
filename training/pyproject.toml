[project]
name = "sqlwarden-training"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.8.0",
    "transformers==4.57.6",
    "peft==0.18.1",
    "accelerate==1.12.0",
    "bitsandbytes==0.50.2",
    "huggingface-hub>=0.36,<1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
